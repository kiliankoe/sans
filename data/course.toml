# Track A: layer 1 letters and Shift.
#
# The order follows the KTouch/gtypist Neo course (finger pairs from the home row outward)
# for the first 17 letters and punctuation, then pulls the remaining ASCII letters forward so
# English and code words are available early, and leaves the umlauts last. A lesson without
# `new` keys is a review; `shift = true` makes the new keys the capitals of everything learnt.

[[lesson]]
id = "a01"
title = "e and n"
new = ["e", "n"]

[[lesson]]
id = "a02"
title = "a and r"
new = ["a", "r"]

[[lesson]]
id = "a03"
title = "u and d"
new = ["u", "d"]

[[lesson]]
id = "a04"
title = "i and t"
new = ["i", "t"]

[[lesson]]
id = "a05"
title = "Home row check"

[[lesson]]
id = "a06"
title = "l"
new = ["l"]

[[lesson]]
id = "a07"
title = "g"
new = ["g"]

[[lesson]]
id = "a08"
title = "c"
new = ["c"]

[[lesson]]
id = "a09"
title = "h"
new = ["h"]

[[lesson]]
id = "a10"
title = "Review"

[[lesson]]
id = "a11"
title = "o"
new = ["o"]

[[lesson]]
id = "a12"
title = "s"
new = ["s"]

[[lesson]]
id = "a13"
title = "w"
new = ["w"]

[[lesson]]
id = "a14"
title = "k"
new = ["k"]

[[lesson]]
id = "a15"
title = "Review"

[[lesson]]
id = "a16"
title = "p"
new = ["p"]

[[lesson]]
id = "a17"
title = "m"
new = ["m"]

[[lesson]]
id = "a18"
title = "z"
new = ["z"]

[[lesson]]
id = "a19"
title = "b"
new = ["b"]

[[lesson]]
id = "a20"
title = "Review"

[[lesson]]
id = "a21"
title = "Comma and full stop"
new = [",", "."]

[[lesson]]
id = "a22"
title = "Capitals"
shift = true

[[lesson]]
id = "a23"
title = "v and f"
new = ["v", "f"]

[[lesson]]
id = "a24"
title = "y and x"
new = ["y", "x"]

[[lesson]]
id = "a25"
title = "j and q"
new = ["j", "q"]

[[lesson]]
id = "a26"
title = "Review"

[[lesson]]
id = "a27"
title = "ä, ö and ü"
new = ["ä", "ö", "ü"]

[[lesson]]
id = "a28"
title = "ß and hyphen"
new = ["ß", "-"]

[[lesson]]
id = "a29"
title = "Final review"
